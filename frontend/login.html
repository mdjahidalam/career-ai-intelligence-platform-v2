<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career AI - Login</title>

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="logo">

            <h1>Career AI</h1>

            <p>Intelligence Platform</p>

        </div>

        <form id="loginForm">

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

            </div>

            <button
                id="loginButton"
                type="submit">

                Login

            </button>

        </form>

        <div class="footer">

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </div>

    </div>

</div>

<script src="js/config/api.js"></script>

<script src="js/auth/login.js"></script>

</body>

</html>
